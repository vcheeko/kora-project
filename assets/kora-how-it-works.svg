<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">How KORA Works</title>
  <desc id="desc">A high-level product flow from human intent through KORA orchestration to verified execution and persistent continuation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e3ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#6ddcff"/>
    </marker>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <text x="90" y="95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#f7f9ff">How KORA Works</text>
  <text x="90" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#aab6d3">Human intent on top. Persistent state, bounded execution and verification underneath.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="80" y="245" width="240" height="170" rx="24" fill="#172139" stroke="#2a3857"/>
    <text x="200" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#72e4ff">1 · HUMAN</text>
    <text x="200" y="343" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">State the goal</text>
    <text x="200" y="380" text-anchor="middle" font-size="17" fill="#aab6d3">Normal language</text>

    <rect x="390" y="220" width="330" height="220" rx="28" fill="#18253f" stroke="#527cba" stroke-width="1.5"/>
    <text x="555" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#8aeaff">2 · KORA CORE</text>
    <text x="555" y="316" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Understand + organize</text>
    <text x="555" y="354" text-anchor="middle" font-size="17" fill="#b7c3dd">Intent · state · dependencies</text>
    <text x="555" y="383" text-anchor="middle" font-size="17" fill="#b7c3dd">risk · authority · next action</text>

    <rect x="790" y="245" width="280" height="170" rx="24" fill="#172139" stroke="#2a3857"/>
    <text x="930" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#9d91ff">3 · EXECUTE</text>
    <text x="930" y="343" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Tools + agents</text>
    <text x="930" y="380" text-anchor="middle" font-size="17" fill="#aab6d3">Only within authority</text>

    <rect x="1140" y="220" width="360" height="220" rx="28" fill="#18253f" stroke="#527cba" stroke-width="1.5"/>
    <text x="1320" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#8aeaff">4 · VERIFY + CONTINUE</text>
    <text x="1320" y="316" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Trust the outcome</text>
    <text x="1320" y="354" text-anchor="middle" font-size="17" fill="#b7c3dd">Evidence · receipt · state update</text>
    <text x="1320" y="383" text-anchor="middle" font-size="17" fill="#b7c3dd">next valid action · resume later</text>
  </g>

  <path d="M320 330 H375" stroke="#6ddcff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M720 330 H775" stroke="#6ddcff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1070 330 H1125" stroke="#6ddcff" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="205" y="520" width="1190" height="115" rx="24" fill="#10192d" stroke="#293957"/>
  <text x="800" y="563" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="url(#accent)">KORA’s design goal</text>
  <text x="800" y="602" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#eef3ff">Make complex AI-assisted work feel simple without hiding authority, state or verification.</text>
  <text x="1500" y="704" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#657390">Public concept · implementation details intentionally omitted</text>
</svg>